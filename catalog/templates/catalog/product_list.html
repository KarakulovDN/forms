{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h1>Список продуктов</h1>
    <a href="{% url 'catalog:product_create' %}" class="btn btn-primary mb-3">Добавить продукт</a>

    <div class="row">
        {% for product in products %}
        <div class="col-md-4 mb-4">
            <div class="card h-100">
                {% if product.image %}
                <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}">
                {% endif %}
                <div class="card-body">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <p class="card-text">{{ product.description|truncatechars:100 }}</p>
                    <p class="text-muted">Цена: {{ product.price }} руб.</p>
                </div>
                <div class="card-footer">
                    <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-info">Подробнее</a>
                    <a href="{% url 'catalog:product_update' product.pk %}" class="btn btn-warning">Изменить</a>
                    <a href="{% url 'catalog:product_delete' product.pk %}" class="btn btn-danger">Удалить</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
